services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tenkou-tk-web
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - OWM_API_KEY=${OWM_API_KEY:-}  # Optional: pass your OpenWeatherMap API Key
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
