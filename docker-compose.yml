services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: pelindung-web
    container_name: tenkou-tk-web
    ports:
      - "${HOST_PORT:-8000}:8000"
    # Kredensial (RTSP_USER, RTSP_PASS, OWM_API_KEY) dibaca dari .env saat container dijalankan,
    # tidak disimpan di dalam image. Lihat .env.example.
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8000
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    mem_limit: 1g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
